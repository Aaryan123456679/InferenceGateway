name: inference-gateway

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11435:11434"]
    volumes: ["ollama_models:/root/.ollama"]

  gateway:
    build:
      # Compose resolves relative build paths against THIS file's own
      # directory (docker/), not the invocation cwd - ../.. reaches
      # Projects/ (docker/ -> InferenceGateway/ -> Projects/), the parent
      # of both aikit and InferenceGateway.
      context: ../..
      dockerfile: InferenceGateway/docker/Dockerfile
    ports: ["8001:8000"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  ollama_models:
